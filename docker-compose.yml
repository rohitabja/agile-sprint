services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - agilesprint-mongo:/data/db
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: >-
        bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
        printf "GET /realms/demo/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
        IFS=" " read -r _ status _ <&3 &&
        test "$$status" = 200'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  agilesprint-mongo:
